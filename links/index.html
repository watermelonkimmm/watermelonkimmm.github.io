<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>김수박 링크</title><meta name="description" content="김수박 링크 · 무료 자료 · 협업 문의"><meta property="og:title" content="김수박 링크"><meta property="og:description" content="김수박 링크 · 무료 자료 · 협업 문의">
<meta property="og:image" content="https://watermelonkimmm.github.io/img/DdBjOZezYF3.jpg"><link rel='stylesheet' href='https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css'><link href='https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap' rel='stylesheet'><style>
:root{--bg:#16191e;--card:#1e2228;--line:#2b3038;--tx:#f5f5f2;--mu:#9aa0a8;--acc:#b8ecfb;--warm:#e9d8b4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}.wrap{max-width:620px;margin:0 auto;padding:40px 18px 80px}
.serif{font-family:'Instrument Serif',serif;font-weight:400}
.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 16px;border:2px solid var(--line)}
h1{text-align:center;font-size:26px;margin:0}.tag{text-align:center;color:var(--mu);margin:8px 0 0;font-size:14px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:26px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--mu)}
h2{font-size:16px;margin:30px 0 12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.reel{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:9/16;background:#222;text-decoration:none}
.reel img{width:100%;height:100%;object-fit:cover;display:block}
.reel span{position:absolute;left:0;right:0;bottom:0;padding:22px 8px 8px;font-size:11px;line-height:1.35;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.reel b{display:block;font-size:13px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;font-size:14px;line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:5px 11px;color:var(--mu)}
.btn{display:block;text-align:center;background:var(--acc);color:#0f1215;font-weight:800;text-decoration:none;border-radius:16px;padding:15px;margin-top:10px}
.btn.ghost{background:none;color:var(--tx);border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px;text-decoration:none}
.row .ic{width:42px;height:42px;border-radius:12px;background:#2a2f37;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.row b{display:block;font-size:15px}.row small{color:var(--mu);font-size:13px}.row .ar{margin-left:auto;color:var(--mu)}
.hero{background:var(--acc);color:#0f1215;border-radius:22px;padding:20px;margin:22px 0}
.hero .badge{display:inline-block;background:#0f1215;color:#fff;border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700}
.hero h3{margin:10px 0 4px;font-size:19px}.hero p{margin:0;font-size:14px}
.foot{text-align:center;color:var(--mu);font-size:12px;margin-top:40px}
.foot a{color:var(--mu)}
